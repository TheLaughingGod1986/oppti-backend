name: patch-loops-test
on:
  workflow_dispatch:
  push:
    branches: [feat/content-refresh-routes]
    paths:
      - '.github/workflows/patch-loops-test.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/content-refresh-routes
      - name: Patch loops.test.js
        run: |
          set -euo pipefail
          f=fresh-stack/tests/unit/loops.test.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('fresh-stack/tests/unit/loops.test.js')
          s = p.read_text()
          old1 = "    ['internal_linking', 'internal-linking']\n  ])('account creation"
          new1 = "    ['internal_linking', 'internal-linking'],\n    ['content_refresh', 'content-refresh']\n  ])('account creation"
          old2 = "      ['internal_linking', 'internalLinking']\n    ];"
          new2 = "      ['internal_linking', 'internalLinking'],\n      ['content_refresh', 'contentRefresh']\n    ];"
          old3 = "test.each(['alt_text', 'titles', 'internal_linking'])("
          new3 = "test.each(['alt_text', 'titles', 'internal_linking', 'content_refresh'])("
          assert old1 in s, 'missing old1'
          assert old2 in s, 'missing old2'
          assert old3 in s, 'missing old3'
          s = s.replace(old1, new1, 1).replace(old2, new2, 1).replace(old3, new3, 1)
          expected = 'b0632dbd106770e67136bd718e088297e8b4efb9a9688ba52b8fb74e77e83aa1'
          import hashlib
          assert hashlib.sha256(s.encode()).hexdigest() == expected, hashlib.sha256(s.encode()).hexdigest()
          p.write_text(s)
          print('patched ok', len(s))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "Update loops.test.js for content_refresh plugin" || exit 0
          git push
