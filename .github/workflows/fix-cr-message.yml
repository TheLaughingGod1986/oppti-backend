name: fix-cr-message
on:
  workflow_dispatch:
  push:
    branches: [feat/content-refresh-routes]
    paths:
      - '.github/workflows/fix-cr-message.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/content-refresh-routes
      - name: Fix quota error message fallback
        run: |
          set -euo pipefail
          f=fresh-stack/routes/contentRefresh.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('fresh-stack/routes/contentRefresh.js')
          s = p.read_text()
          old = "message: 'Could not load content refresh quota'"
          new = "message: status.message || 'Could not load content refresh quota'"
          if old not in s:
            if new in s:
              print('already fixed')
              raise SystemExit(0)
            raise SystemExit('pattern not found')
          p.write_text(s.replace(old, new, 1))
          print('fixed')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "Restore contentRefresh quota error message fallback" || exit 0
          git push
